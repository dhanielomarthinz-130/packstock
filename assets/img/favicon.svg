<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    
    <!-- Letter D Primary Gradient -->
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Inner Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="24" cy="24" r="36" fill="#10b981" opacity="0.2" filter="blur(8px)"/>

  <!-- Stylized Letter "D" Geometric Monogram -->
  <g filter="url(#glow)">
    <!-- Main Outer & Inner D Shape -->
    <path d="M 32 25 L 63 25 C 83 25 96 38 96 64 C 96 90 83 103 63 103 L 32 103 Z M 49 42 L 49 86 L 61 86 C 72 86 80 77 80 64 C 80 51 72 42 61 42 Z" 
          fill="url(#dGrad)" 
          fill-rule="evenodd" />

    <!-- Left Spine Facet with 3D Depth -->
    <path d="M 32 25 L 49 42 L 49 86 L 32 103 Z" fill="url(#accentGrad)" opacity="0.85"/>
    
    <!-- Glowing Center Accent Node -->
    <circle cx="64" cy="64" r="4.5" fill="#ffffff" />
  </g>
</svg>
